name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Regenerate demo data and check it is deterministic
        run: |
          python -m generator --demo --out /tmp/data
          for f in data/*; do cmp "$f" "/tmp/data/$(basename "$f")"; done
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t echo-pitch:ci .
      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name ep echo-pitch:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 1; done
          curl -fs localhost:8000/api/matches | grep -q EP-2026-001
